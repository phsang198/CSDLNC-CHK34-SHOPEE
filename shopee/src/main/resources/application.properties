server.port=8080

# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/your_database
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# Redis configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password= # Nếu không có mật khẩu, để trống
spring.redis.database=0

# Enable Redis cache
spring.cache.type=redis

# Cassandra configuration
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.keyspace-name=shopee
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.username= # Nếu Cassandra yêu cầu username
spring.cassandra.password= # Nếu Cassandra yêu cầu password